name: Release Drive Assistant

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example v0.3.54'
        required: true
        type: string
      publish_release:
        description: 'Create or update the GitHub release'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  package-windows:
    runs-on: windows-latest

    env:
      DOTNET_NOLOGO: true
      CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
      CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
      CODESIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_CODESIGN_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $version = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.version }}" } else { "${{ github.ref_name }}" }
          if ($version -notmatch '^v\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Version '$version' must look like v0.3.54."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore DriveAssistant.Cli/DriveAssistant.Cli.csproj

      - name: Test
        run: dotnet test DriveAssistant.sln -c Release --no-restore

      - name: Publish self-contained Windows x64 app
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $publishDir = Join-Path $PWD "publish\DriveAssistant-$version-win-x64"
          dotnet publish DriveAssistant.Wpf\DriveAssistant.Wpf.csproj -c Release -r win-x64 --self-contained true -o $publishDir
          @"
          Drive Assistant $version

          Quick start:
          1. Extract this ZIP to a normal folder.
          2. Run "Drive Assistant.exe".
          3. Keep the tools folder next to the executable for native PlayStation helpers.
          "@ | Set-Content -Path (Join-Path $publishDir "RUNNING_DRIVE_ASSISTANT.txt") -Encoding UTF8
          "publish_dir=$publishDir" >> $env:GITHUB_ENV

      - name: Sign Windows binaries
        if: env.CODESIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CODESIGN_PFX_PASSWORD)) {
            throw "WINDOWS_CODESIGN_PFX_PASSWORD must be set when WINDOWS_CODESIGN_PFX_BASE64 is set."
          }

          $certPath = Join-Path $env:RUNNER_TEMP "drive-assistant-codesign.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signtool) {
            throw "signtool.exe was not found on the runner."
          }

          $targets = @(
            Join-Path $env:publish_dir "Drive Assistant.exe"
          ) | Where-Object { Test-Path $_ }

          foreach ($target in $targets) {
            & $signtool.FullName sign /f $certPath /p $env:CODESIGN_PFX_PASSWORD /fd SHA256 /tr $env:CODESIGN_TIMESTAMP_URL /td SHA256 $target
            & $signtool.FullName verify /pa /v $target
          }

      - name: Skip signing notice
        if: env.CODESIGN_PFX_BASE64 == ''
        run: echo "WINDOWS_CODESIGN_PFX_BASE64 is not configured; publishing unsigned binaries with SHA256 checksums."

      - name: Create ZIP and checksum
        id: package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $zip = Join-Path $PWD "publish\DriveAssistant-$version-win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $env:publish_dir '*') -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          $shaFile = "$zip.sha256"
          "$hash  $(Split-Path $zip -Leaf)" | Set-Content -Path $shaFile -Encoding ASCII
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "sha=$shaFile" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DriveAssistant-${{ steps.version.outputs.version }}-win-x64
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.sha }}

      - name: Write release notes
        shell: pwsh
        run: |
          @"
          Portable Windows x64 build of Drive Assistant.

          SHA256:
          ```${{ steps.package.outputs.sha256 }}```
          "@ | Set-Content -Path release-notes.md -Encoding UTF8

      - name: Publish GitHub release
        if: github.event_name == 'push' || inputs.publish_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $zipAsset = "${{ steps.package.outputs.zip }}#DriveAssistant-$version-win-x64.zip"
          $shaAsset = "${{ steps.package.outputs.sha }}#DriveAssistant-$version-win-x64.zip.sha256"
          gh release view $version *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $version $zipAsset $shaAsset --clobber
            gh release edit $version --title "Drive Assistant $version" --notes-file release-notes.md
          } else {
            gh release create $version $zipAsset $shaAsset --title "Drive Assistant $version" --notes-file release-notes.md --verify-tag
          }

  package-linux-cli:
    needs: package-windows
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64]

    env:
      DOTNET_NOLOGO: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $version = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.version }}" } else { "${{ github.ref_name }}" }
          if ($version -notmatch '^v\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Version '$version' must look like v0.3.54."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore DriveAssistant.sln

      - name: Publish self-contained Linux CLI
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          rid="${{ matrix.rid }}"
          publish_dir="$PWD/publish/DriveAssistant.Cli-$version-$rid"
          dotnet publish DriveAssistant.Cli/DriveAssistant.Cli.csproj -c Release -r "$rid" --self-contained true -o "$publish_dir"
          cat > "$publish_dir/RUNNING_DRIVE_ASSISTANT_CLI.txt" <<EOF
          Drive Assistant CLI $version ($rid)

          Run:
            ./drive-assistant --help

          The CLI is read-only against source images and is intended for Linux/macOS/terminal workflows.
          EOF
          echo "publish_dir=$publish_dir" >> "$GITHUB_ENV"

      - name: Create tarball and checksum
        id: package
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          rid="${{ matrix.rid }}"
          archive="$PWD/publish/DriveAssistant.Cli-$version-$rid.tar.gz"
          tar -C "$publish_dir" -czf "$archive" .
          sha="$(sha256sum "$archive" | awk '{print $1}')"
          sha_file="$archive.sha256"
          printf "%s  %s\n" "$sha" "$(basename "$archive")" > "$sha_file"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "sha=$sha_file" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DriveAssistant.Cli-${{ steps.version.outputs.version }}-${{ matrix.rid }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.sha }}

      - name: Publish Linux CLI assets
        if: github.event_name == 'push' || inputs.publish_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          rid="${{ matrix.rid }}"
          archive_asset="${{ steps.package.outputs.archive }}#DriveAssistant.Cli-$version-$rid.tar.gz"
          sha_asset="${{ steps.package.outputs.sha }}#DriveAssistant.Cli-$version-$rid.tar.gz.sha256"
          gh release upload "$version" "$archive_asset" "$sha_asset" --clobber
